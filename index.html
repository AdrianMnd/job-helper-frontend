<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1A1D24" />
    <title>Job Helper</title>
  </head>
  <body>
    <div id="initial-loader" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#1A1D24;">
  <div style="width:56px;height:56px;border-radius:50%;border:2px solid #2E6EFF;display:flex;align-items:center;justify-content:center;">
    <span style="font-family:'Space Grotesk',ui-sans-serif,sans-serif;font-weight:700;font-size:20px;color:#2E6EFF;">JH</span>
  </div>
  <div style="width:120px;height:3px;background:#2E333D;border-radius:2px;overflow:hidden;">
    <div style="width:40%;height:100%;background:#2E6EFF;border-radius:2px;animation:jh-loading-bar 1.1s ease-in-out infinite;"></div>
  </div>
</div>
<style>
  @keyframes jh-loading-bar {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
</style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
